name: Update Sileo Repository

on:
  push:
    paths:
      - 'debs/**'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all indexes'
        required: false
        default: 'false'

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install dpkg-dev bzip2 gzip -y
    
    - name: Check deb files
      run: |
        if [ ! -d "debs" ]; then
          mkdir -p debs
        fi
        COUNT=$(find debs -name "*.deb" -type f | wc -l)
        echo "Found $COUNT .deb files"
    
    - name: Generate Packages with ALL versions
      run: |
        rm -f Packages Packages.bz2 Packages.gz
        
        if [ -n "$(find debs -name '*.deb' -print -quit)" ]; then
          # Use -m to allow multiple versions of the same package
          dpkg-scanpackages -m debs /dev/null > Packages
          
          # Fix pathing for Sileo compatibility
          sed -i 's|Filename: debs/|Filename: ./debs/|g' Packages
          
          # Update Release file date to refresh Sileo cache
          if [ -f "Release" ]; then
            sed -i "s/^Date: .*/Date: $(date -R)/" Release
          fi
        else
          touch Packages
        fi
    
    - name: Create compressed versions
      run: |
        if [ -f "Packages" ]; then
          bzip2 -9fk Packages
          gzip -9fk Packages
          
          # Create a simple manifest for tracking
          echo "Repository: $(basename ${{ github.repository }})" > VERSIONS.txt
          echo "Last Updated: $(date)" >> VERSIONS.txt
          echo "---" >> VERSIONS.txt
          grep -E '^Package:|^Version:' Packages >> VERSIONS.txt
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        git add Packages Packages.bz2 Packages.gz VERSIONS.txt Release
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: update repository index [$(date +%Y%m%d-%H%M%S)]"
          git push
        fi
